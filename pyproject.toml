[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eyram Cobblah", email = "ecobblah2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]

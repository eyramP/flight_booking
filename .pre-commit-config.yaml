repos:
  # Ruff: Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.17.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        # Run the formatter
      - id: ruff-format

  # General checks for files and whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
